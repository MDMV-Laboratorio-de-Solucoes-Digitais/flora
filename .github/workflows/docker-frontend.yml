name: Build & Deploy Flora Web — Production (GHCR -> Coolify)

# Automatic on push/merge to `main` (production web); `workflow_dispatch` is
# the manual backup. A push/merge from `dev` cannot reach this workflow's job
# guard, and the existing secret names are kept so no live configuration change
# is needed. The deploy fails closed when its webhook secret is missing.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: "Trigger the Coolify webhook after publishing the image"
        type: boolean
        required: false
        default: true

concurrency:
  group: deploy-flora-production-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04-arm
    env:
      DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_FRONTEND_DEPLOY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail closed when the deploy webhook is missing
        if: ${{ (github.event_name == 'push' || inputs.deploy) && env.DEPLOY_WEBHOOK == '' }}
        run: |
          echo "::error::COOLIFY_FRONTEND_DEPLOY_WEBHOOK is not configured; refusing a deploy that would silently skip."
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/mdmv-laboratorio-de-solucoes-digitais/flora-web:production
            ghcr.io/mdmv-laboratorio-de-solucoes-digitais/flora-web:${{ github.sha }}

      - name: Trigger Coolify production web deploy
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        env:
          WEBHOOK_URL: ${{ env.DEPLOY_WEBHOOK }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $API_TOKEN"
