name: Build & Deploy Flora Web (GHCR -> Coolify)

# Manual only: publishing flora-web and calling the Coolify webhook are real
# deploys and stay outside the autonomous CI merge gates.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    # GitHub Actions forbids `secrets.*` inside `if:`. Hoist to job-level env.
    env:
      HAS_HOOK: ${{ secrets.COOLIFY_FRONTEND_DEPLOY_WEBHOOK != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/mdmv-laboratorio-de-solucoes-digitais/flora-web:production
            ghcr.io/mdmv-laboratorio-de-solucoes-digitais/flora-web:${{ github.sha }}

      - name: Ensure GHCR package is publicly pullable
        run: |
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/flora-web/visibility" \
            -d '{"visibility":"public"}'

      - name: Trigger Coolify Frontend Deploy
        if: ${{ env.HAS_HOOK == 'true' }}
        run: |
          curl -fsS -X POST "${{ secrets.COOLIFY_FRONTEND_DEPLOY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
