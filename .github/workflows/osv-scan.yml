name: OSV Scan (weekly, advisory)
# 028: one scheduled advisory sweep. Non-blocking; Dependabot alerts remain the
# load-bearing signal. Public repo, no GHAS required.
on:
  schedule:
    - cron: '37 14 * * 1'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2
    with:
      scan-args: |-
        -L=Cargo.lock
      fail-on-vuln: false
