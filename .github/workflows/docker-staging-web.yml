name: Build & Deploy Flora Web — Staging (GHCR -> Coolify)

# Manual ONLY (ADR-0003). Staging web is a separate app/FQDN from the staging
# API and from production; never reuse the production webhook or image tag.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Trigger the Coolify webhook after publishing the image"
        type: boolean
        required: false
        default: true

concurrency:
  group: deploy-flora-staging-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04-arm
    env:
      DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEB_DEPLOY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail closed when the deploy webhook is missing
        if: ${{ inputs.deploy && env.DEPLOY_WEBHOOK == '' }}
        run: |
          echo "::error::COOLIFY_STAGING_WEB_DEPLOY_WEBHOOK is not configured; refusing a deploy that would silently skip."
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/mdmv-laboratorio-de-solucoes-digitais/flora-web:staging
            ghcr.io/mdmv-laboratorio-de-solucoes-digitais/flora-web:${{ github.sha }}

      - name: Trigger Coolify staging web deploy
        if: ${{ inputs.deploy }}
        env:
          WEBHOOK_URL: ${{ env.DEPLOY_WEBHOOK }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $API_TOKEN"
