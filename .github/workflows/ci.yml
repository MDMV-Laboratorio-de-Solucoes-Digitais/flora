name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Svelte check
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Unit tests (server)
        run: bun run test:unit -- --run --project server
      - name: Build
        run: bun run build
