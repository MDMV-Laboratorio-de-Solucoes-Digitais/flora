name: Rust CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - name: Install dependencies
        run: cargo build
      - name: Run tests
        run: cargo test
      - name: Build
        run: cargo build --release
