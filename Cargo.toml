# =========================================================================
# FLORA WORKSPACE - ROOT CARGO.TOML
# =========================================================================

[package]
name = "flora"
version = "0.1.0"
edition = "2024"

[dependencies]

[lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"

[lints.clippy]
pedantic = "deny"
nursery = "warn"

# =========================================================================
# Build Profiles
# =========================================================================

# Dev profile: fast compilation, slow runtime (acceptable for dev)
[profile.dev]
opt-level = 0
incremental = true

# CI Profile: Fast builds for PR validation (inherits from dev)
# Used by nextest and GitHub Actions
[profile.ci]
inherits = "dev"
debug = 1          # Only line tables for best backtraces on panic
opt-level = 0      # No optimizations (fastest compile)
incremental = true # Enable incremental compilation

# Release Profile: Optimized for production binaries (Coolify / Desktop)
[profile.release]
strip = true       # Strip symbols from binary (reduces size)
lto = "thin"       # Thin Link-Time Optimization (balances speed and size)
codegen-units = 1  # Single codegen unit for better optimization
opt-level = 3      # Maximum optimization for speed
panic = "abort"    # Abort on panic (removes unwinding bloat)
