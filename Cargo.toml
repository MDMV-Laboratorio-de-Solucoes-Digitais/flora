# =========================================================================
# FLORA WORKSPACE - ROOT CARGO.TOML
# A modular monolith using Cargo Workspaces + Modules
# AGPL-3.0-or-later - Self-hostable, open-source corporate platform
# =========================================================================

[package]
name = "flora"
version = "0.1.0"
description = "Flora Workspace - Self-hostable corporate collaboration platform"
repository.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true

[workspace]
resolver = "3"
package.rust-version = "1.97"
package.edition = "2024"
package.license = "AGPL-3.0-or-later"
package.authors = ["Flora Workspace  - MDMV Laboratório de Soluções Digitais"]
package.repository = "https://github.com/MDMV-Laboratorio-de-Solucoes-Digitais/MDMV"

members = [
    "flora-core",
    "flora-api",
    "flora-messaging",
    "flora-tasks",
    "flora-files",
    "flora-search",
    "flora-notifications",
    "flora-tests",
]
exclude = ["docker-compose.yml"]

# =========================================================================
# Workspace Lint Configuration
# =========================================================================

[lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
pedantic = { level = "forbid", priority = -1 }
allow_attributes = "deny"
unwrap_used = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
nursery = { level = "warn", priority = -1 }

# =========================================================================
# Build Profiles
# =========================================================================

[profile.dev]
opt-level = 0
incremental = true

[profile.ci]
inherits = "dev"
debug = 1
opt-level = 0
incremental = true

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"

# =========================================================================
# Workspace Dependencies (available to all crates)
# =========================================================================
[workspace.dependencies]
# --- Internal crates ---
flora-api = { path = "flora-api"}
flora-core = { path = "flora-core" }
flora-files = { path = "flora-files" }
flora-messaging = { path = "flora-messaging" }
flora-notifications = { path = "flora-notifications" }
flora-search = { path = "flora-search" }
flora-tasks = { path = "flora-tasks" }
flora-tests = { path = "flora-tests" }

# --- flora-core dependencies ---
rust-i18n = "3.1"

# --- flora-tests dependencies ---
reqwest = { version = "0.12", features = ["json"] }

# --- Async Runtime ---
tokio = { version = "1.43", features = ["full"] }

# --- Web Framework ---
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# --- Serialization ---
serde_json = "1.0"
serde_yaml = "0.9"
serde = { version = "1.0", features = ["derive"] }

# --- Database ---
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# --- Cache / Queue ---
redis = { version = "1.6", features = ["tokio-comp", "connection-manager"] }

# --- Error Handling ---
thiserror = "2.0"
anyhow = "1.0"
eyre = "0.9"

# --- Logging & Tracing ---
tracing = "0.1"
tracing-appender = "0.2"
opentelemetry = "0.28"
tracing-opentelemetry = "0.29"
opentelemetry-otlp = "0.22"
opentelemetry_sdk = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }

# --- Authentication ---
openidconnect = "4.0"

# --- Search ---
meilisearch-sdk = "0.29"

# --- Utilities ---
async-trait = "0.1"
bytes = "1.9"
futures = "0.3"
base64 = "0.22"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
backoff = { version = "0.4", features = ["tokio"] }

# --- Validation ---
validator = { version = "0.21", features = ["derive"] }

# --- Additional dependencies used by crates ---

tower-service = "0.3"
mime = "0.3"
mime_guess = "2.0"
multipart = "1.0"
tempfile = "3.14"
tokio-native-tls = "0.3"
rustls = "0.23"
tokio-rustls = "0.26"
lettre = "0.11"
serde_urlencoded = "0.7"
hmac = "0.12"
jwt = "0.16"
time = "0.3"
axum-msgpack = "0.8"
bcrypt = "0.16"
regex = "1.11"
chrono-tz = "0.10"
jsonwebtoken = "10.4.0"
hyper = { version = "1.5", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
axum-extra = { version = "0.10", features = ["cookie"] }
url = { version = "2.5", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }

# --- Testing ---
mockall = "0.13"
wiremock = "0.6"
proptest = "1.5"
quickcheck = "1.0"
tokio-test = "0.4"

# --- CLI ---
clap = { version = "4.5", features = ["derive", "env"] }
figment = { version = "0.10", features = ["env", "toml", "yaml"] }

# --- Config ---
config = "0.14"

# =========================================================================
